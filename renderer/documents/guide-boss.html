<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Guide des boss</title>
<link rel="stylesheet" href="../polices.css">
<style>
:root{
  --nuit:#0A0A0A; --pierre:#111315; --pierre-h:#171A1D; --trait:#242A2E;
  --trait-c:#323A3F; --sarcelle:#388888; --eclat:#78F8F8; --or:#D8B45A;
  --texte:#E6EAEC; --doux:#8B979C; --faible:#59636A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:var(--trait-c) transparent}
body{background:transparent;color:var(--texte);
  font-family:"Barlow",system-ui,sans-serif;font-size:14px;line-height:1.55;
  padding:14px 16px 40px}
::selection{background:rgba(56,136,136,.4)}

/* ---------------------------------------------------------- barre de recherche */
.tete{position:sticky;top:0;z-index:5;background:linear-gradient(#0A0A0A 78%,transparent);
  padding-bottom:10px;margin:-14px -16px 12px;padding:14px 16px 12px}
.chercher{position:relative;display:block}
.chercher svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--faible);pointer-events:none}
#q{width:100%;padding:10px 12px 10px 34px;background:var(--pierre);color:var(--texte);
  border:1px solid var(--trait);border-radius:8px;font:inherit;outline:none}
#q:focus{border-color:var(--sarcelle);box-shadow:0 0 0 3px rgba(56,136,136,.15)}
#q::placeholder{color:var(--faible)}

.filtres{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;align-items:center}
.filtres button{background:var(--pierre);color:var(--doux);border:1px solid var(--trait);
  border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.filtres button:hover{background:var(--pierre-h);color:var(--texte)}
.filtres button[aria-pressed="true"]{background:rgba(56,136,136,.18);
  border-color:var(--sarcelle);color:var(--eclat)}
.compte{margin-left:auto;color:var(--faible);font-size:12.5px;
  font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------------- liste */
ol{list-style:none;display:flex;flex-direction:column;gap:5px}
li{border:1px solid var(--trait);border-radius:9px;background:var(--pierre);
  overflow:hidden}
li:hover{border-color:var(--trait-c)}
li[open-fiche]{border-color:var(--sarcelle);background:var(--pierre-h)}

.ligne{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;
  background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.vignette{flex:none;width:34px;height:34px;border-radius:7px;display:grid;
  place-items:center;background:var(--nuit);border:1px solid var(--trait);
  position:relative;overflow:hidden}
.vignette img{width:26px;height:26px;image-rendering:pixelated}
.vignette .mono{font-weight:600;font-size:14px;letter-spacing:.02em}
.vignette::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;
  background:var(--bord)}

.nom{flex:1;min-width:0}
.nom .n{font-weight:500;letter-spacing:.01em}
.nom .s{color:var(--faible);font-size:12px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
mark{background:rgba(120,248,248,.22);color:var(--eclat);border-radius:2px}

.etiq{flex:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;border:1px solid var(--trait-c);color:var(--doux)}
.etiq.gemme{color:var(--or);border-color:rgba(216,180,90,.4)}
.etiq.postgame{color:#C08AE0;border-color:rgba(192,138,224,.4)}
.chev{flex:none;color:var(--faible);transition:transform .15s}
li[open-fiche] .chev{transform:rotate(90deg);color:var(--eclat)}

/* ---------------------------------------------------------------------- fiche */
.fiche{padding:2px 12px 13px 57px;border-top:1px solid var(--trait)}
.fiche dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin-top:11px}
.fiche dt{color:var(--sarcelle);font-size:11.5px;letter-spacing:.07em;
  text-transform:uppercase;padding-top:2px;white-space:nowrap}
.fiche dd{color:var(--texte)}
.stats{display:flex;gap:16px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--trait);color:var(--doux);font-size:12.5px}
.stats b{color:var(--texte);font-weight:600;font-variant-numeric:tabular-nums}
.indice{margin-top:10px;padding:9px 11px;border-left:2px solid var(--trait-c);
  background:var(--nuit);color:var(--doux);font-style:italic;white-space:pre-wrap}

.vide{text-align:center;color:var(--faible);padding:40px 0}
.vide b{color:var(--doux);display:block;margin-bottom:4px}
</style>
</head>
<body>

  <label class="chercher">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false"

  <div class="filtres">

    <button data-f="postgame" aria-pressed="false">Post-game</button>
    <span class="compte" id="compte"></span>
  </div>
</div>

imic", "couleur": "#B8963A", "pv": 1000, "degats": 20, "categorie": "postgame", "ou": "?", "trouver": "?", "faire": "?", "lieu": "", "oeil": null, "image": null}, {"id": "wraithon:wraithon", "nom": "The Wraithon", "tri": "the wraithon", "recherche": "the wraithon wraithon:wraithon celui qui n'a garde que sa memoire nulle part. ce boss n'apparait dans aucune structure du monde. [?] non confirme - possede une barre de boss", "mod": "wraithon", "modNom": "Wraithon", "couleur": "#6A6A8A", "pv": 1000, "degats": 15, "categorie": "gemme", "ou": "NULLE PART. Ce boss n'apparait dans aucune structure du monde.", "trouver": "Il n'y a rien a chercher : il faut le convoquer.", "faire": "L'INVOQUER : fabriquer un EDIT DE CONFRONTATION (wraithon:showdown_edict) avec 7 lingots de netherite, 1 oeuf de dragon et 1 etoile du Nether. Il ouvre son propre biome (the_wraithium_battlegrounds). Sans cette recette, personne ne le trouve jamais - c'est voulu.", "lieu": "nuit", "oeil": null, "image": null, "gemme": "white", "palier": 24, "nomDialogue": "Celui qui n'a garde que sa memoire"}]</script>
<script>
const BOSS = JSON.parse(document.getElementById('donnees').textContent);
const liste = document.getElementById('liste');
const champ = document.getElementById('q');
const compte = document.getElementById('compte');
const vide = document.getElementById('vide');
let filtre = 'tous';
let ouvert = null;

const sansAccents = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const echapper = (t) => t.replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Surligne le mot cherche dans le nom : on voit tout de suite pourquoi la ligne
   est la, meme quand la correspondance vient de l'identifiant ou du lieu. */
function surligner(nom, q) {
  if (!q) return echapper(nom);
  const i = sansAccents(nom).indexOf(q);
  if (i < 0) return echapper(nom);
  return echapper(nom.slice(0, i)) + '<mark>' + echapper(nom.slice(i, i + q.length))
       + '</mark>' + echapper(nom.slice(i + q.length));
}

function vignette(b) {
  if (b.image) return '<img src="img/' + b.image + '" alt="">';
  if (b.oeil) return '<img src="img/oeil-' + b.oeil + '.png" alt="" title="Oeil a fabriquer">';
  return '<span class="mono" style="color:' + b.couleur + '">'
       + echapper(b.nom.slice(0, 1).toUpperCase()) + '</span>';
}

function fiche(b) {
  const l = [];
  l.push('<dl>');
  l.push('<dt>O&ugrave;</dt><dd>' + echapper(b.ou) + '</dd>');
  l.push('<dt>Trouver</dt><dd>' + echapper(b.trouver) + '</dd>');
  l.push('<dt>Sur place</dt><dd>' + echapper(b.faire) + '</dd>');
  if (b.piece) l.push('<dt>Pi&egrave;ce</dt><dd>' + echapper(b.piece) + '</dd>');
  if (b.palier) l.push('<dt>Palier</dt><dd>' + b.palier + ' mal&eacute;dictions</dd>');
  l.push('</dl>');
  l.push('<div class="stats"><span><b>' + (b.pv || '?') + '</b> PV</span>'
       + '<span><b>' + (b.degats || '?') + '</b> d&eacute;g&acirc;ts</span>'
       + '<span>' + echapper(b.modNom) + '</span>'
       + '<span style="color:var(--faible)">' + echapper(b.id) + '</span></div>');
  if (b.indice) l.push('<div class="indice">' + echapper(b.indice) + '</div>');
  return '<div class="fiche">' + l.join('') + '</div>';
}

function dessiner() {
  const q = sansAccents(champ.value.trim());
  const vus = BOSS.filter((b) =>
    (filtre === 'tous' || b.categorie === filtre) && (!q || b.recherche.includes(q)));

  liste.innerHTML = vus.map((b) => {
    const est = b.id === ouvert;
    return '<li data-id="' + b.id + '"' + (est ? ' open-fiche' : '') + '>'
      + '<button class="ligne" type="button" aria-expanded="' + est + '">'
      + '<span class="vignette" style="--bord:' + b.couleur + '">' + vignette(b) + '</span>'
      + '<span class="nom"><span class="n">' + surligner(b.nom, q) + '</span>'
      + '<span class="s">' + echapper(b.ou) + '</span></span>'
      + (b.categorie !== 'piece'
          ? '<span class="etiq ' + b.categorie + '">'
            + (b.categorie === 'gemme' ? 'Gemme' : 'Post-game') + '</span>' : '')
      + '<svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none"'
      + ' stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>'
      + '</button>' + (est ? fiche(b) : '') + '</li>';
  }).join('');

  compte.textContent = vus.length + (vus.length > 1 ? ' boss' : ' boss');
  vide.hidden = vus.length > 0;
}

liste.addEventListener('click', (e) => {
  const li = e.target.closest('li');
  if (!li) return;
  ouvert = (ouvert === li.dataset.id) ? null : li.dataset.id;
  dessiner();
  if (ouvert) {
    const cible = liste.querySelector('li[open-fiche]');
    if (cible) cible.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
});

champ.addEventListener('input', () => { ouvert = null; dessiner(); });

/* Entree ouvre le premier resultat : on cherche un boss, on appuie, on lit. */
champ.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const premier = liste.querySelector('li');
  if (premier) { ouvert = premier.dataset.id; dessiner(); }
});

document.querySelectorAll('.filtres button').forEach((b) => {
  b.addEventListener('click', () => {
    filtre = b.dataset.f;
    document.querySelectorAll('.filtres button').forEach((a) =>
      a.setAttribute('aria-pressed', String(a === b)));
    ouvert = null;
    dessiner();
  });
});

/* Taper n'importe ou ramene au champ de recherche, sans avoir a viser. */
document.addEventListener('keydown', (e) => {
  if (e.target === champ || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Escape') { champ.value = ''; ouvert = null; dessiner(); return; }
  if (e.key.length === 1) { champ.focus(); }
});

dessiner();
champ.focus();
</script>
</body>
</html>
